<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オープニングの原画</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #100e13; color: #e5ddcf; font-family: Georgia, "Yu Mincho", serif; }
    main { max-width: 1320px; margin: auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; font-weight: 500; }
    a { color: #dbc27f; font-size: 14px; }
    section { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; min-width: 0; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: contain; }
    figcaption { padding-top: 8px; font-size: 14px; line-height: 1.5; }
    @media (max-width: 700px) { main { padding: 16px; } section { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>オープニング</h1><a href="../../../?testScene=opening">本編で確認</a></header>
    <section>
      <figure><img src="../../../art/opening/rift.webp" alt="裂けた大地" width="1536" height="1024"><figcaption>一　裂けた大地</figcaption></figure>
      <figure><img src="../../../art/opening/fallen.webp" alt="還らぬ者" width="1536" height="1024"><figcaption>二　還らぬ者</figcaption></figure>
      <figure><img src="../../../art/story/first-vessel-awakening.webp" alt="人業" width="1536" height="1024"><figcaption>三　人業</figcaption></figure>
      <figure><img src="../../../art/opening/ordo.webp" alt="王の操霊師" width="1536" height="1024"><figcaption>四　王の操霊師</figcaption></figure>
      <figure><img src="../../../art/opening/letter.webp" alt="師の手紙" width="1536" height="1024"><figcaption>五　師の手紙</figcaption></figure>
      <figure><img src="../../../art/story/irene-soul-lamp.webp" alt="師の灯" width="1536" height="1024"><figcaption>六　師の灯</figcaption></figure>
    </section>
  </main>
</body>
</html>
