  <!-- モジュールとCSSの到着前も、途中の画面を見せない。 -->
  <style>
    html { background: #000; }
    #studio-splash { isolation:isolate; position:fixed; inset:0; z-index:2147483647; display:flex; align-items:center; justify-content:center; background:#000; opacity:1; transition:opacity .6s ease; cursor:pointer; touch-action:manipulation; }
    #studio-splash img { width:min(88vw,1000px); height:auto; max-height:75dvh; object-fit:contain; }

    #studio-splash.studio-fading { opacity:0; }
    body.studio-branding .image-loading { display:none; }
    body.studio-branding::before, body.studio-branding #media-splash { z-index:2147483646; }
    @media(prefers-reduced-motion:reduce) { #studio-splash { transition-duration:.01s; } }
    body.booting::before, body.screen-loading::before {
      content: ""; position: fixed; inset: 0; background: #000; z-index: 2147483647;
    }
    #media-splash { display:none; position:fixed; inset:0; z-index:2147483647; background:#000; color:#e8dfcc; align-items:center; justify-content:center; flex-direction:column; gap:24px; padding:32px; text-align:center; font-family:serif; }
    body.booting #media-splash, body.screen-loading #media-splash { display:flex; }
    body:has(.cloud-gate:not([hidden])) #media-splash,
    body:has(.cloud-gate:not([hidden]))::before,
    body:has(#local-save-gate) #media-splash,
    body:has(#local-save-gate)::before { display:none; }
    .media-message { font-size:14px; line-height:1.8; max-width:28em; }
    .media-retry { padding:12px 24px; color:inherit; background:#292635; border:1px solid #9a8657; font:inherit; cursor:pointer; }
    body.booting .image-loading { visibility: visible; opacity: 1; }

  <div id="app">
    <header id="topbar">
      <div class="topbar-left">
        <button id="settings-btn" title="設定">⚙</button>
        <button id="return-btn" title="帰還魔法陣から街へ戻る" class="hidden"></button>
        <button id="descend-btn" title="階段を降りる" class="hidden" disabled></button>
      </div>
      <div id="floor-info"></div>
      <div id="topbar-cur"></div>
    </header>

    <!-- 街シェル (オーバーレイ): 見出し + 中身 (#town-screen) + 下のタブバー (src/ui/townshell.js が組み立てる) -->
    <div id="town-shell" class="hidden">
      <div class="ts-head hidden"></div>
      <div id="town-screen" class="hidden"></div>
    </div>

    <!-- アイテム入手 / イベント演出 (共通オーバーレイ) -->
    <div id="item-get" class="hidden"></div>

    <main id="screen">
      <!-- カードボード / 戦闘ビュー -->
      <canvas id="view" width="480" height="320"></canvas>
      <div id="enemy-display-tools" aria-label="敵の表示">
        <span id="enemy-focus" aria-live="polite"></span>
        <button id="enemy-row-toggle" type="button" hidden>後列を手前に</button>
      </div>
      <div id="enemy-names" aria-label="敵の名前"></div>
    </main>

    <!-- 今回の探索の収穫 (階の進み・ゴールド・拾った装備のレア度別の数) -->
    <section id="runbar" class="hidden">
      <div id="runbar-goal" class="rb-goal"></div>
      <button id="run-loot" type="button" aria-label="今回の収穫を見る">
        <span>今回の収穫</span><span id="run-loot-summary" class="rb-loot"></span>
      </button>
      <div id="board-camera-tools" aria-label="盤面の表示">
        <button id="board-overview" type="button" aria-label="迷宮全体を表示">全体</button>
      </div>
    </section>

    <!-- メッセージ -->
    <section id="hud">
      <!-- 戦闘中の行動順 (手番の者を先頭に、このラウンドの残りをアイコンで並べる。game.js renderTurnOrder) -->
      <div id="turn-order" class="hidden" aria-label="行動順"></div>
      <div id="log" aria-live="polite"></div>
    </section>

    <!-- パーティステータス -->
    <section id="party"></section>

    <!-- 戦闘コマンドメニュー -->
    <section id="controls">
      <div id="combat-menu" class="hidden"></div>
    </section>

    <footer id="hint">
      スワイプで移動 ・ タップで移動先指定 ・ 青枠はめくれるカード
    </footer>
  </div>

  <!-- UI の重ね置き場: シート (z 81+n) とトースト (z 85)。src/ui/kit.js -->
  <div id="ui-layer"></div>

  <!-- 縦画面専用: スマホを横向きにした時だけ全面に出る案内 -->
  <div id="rotate-guard" aria-hidden="true">
    <div class="rg-phone"><span></span></div>
    <div class="rg-title">端末を縦向きにしてください</div>
    <div class="rg-sub">この迷宮は縦画面でのみ歩めます</div>
  </div>

  <!-- 縦固定: 対応環境 (Android のホーム画面アプリ / 全画面時) では向きそのものを縦にロックする。
       iOS Safari などロック不可の環境では上の案内で代替する -->
  <script>
    (function () {
      var so = window.screen && screen.orientation;
      // キーボードで表示領域が横長になっても、端末の縦向きを横向きと誤判定しない。
      function updateOrientation() {
        var landscape;
        if (so && /^(portrait|landscape)-/.test(so.type)) {
          landscape = so.type.indexOf("landscape-") === 0;
        } else if (typeof window.orientation === "number") {
          // Screen Orientation API がない iOS 等。
          landscape = Math.abs(window.orientation) % 180 === 90;
        } else {
          var s = window.screen;
          landscape = s && s.width > 0 && s.height > 0
            ? s.width > s.height : window.innerWidth > window.innerHeight;
        }
        document.documentElement.classList.toggle("device-landscape", landscape);
      }
      updateOrientation();
      if (so && typeof so.addEventListener === "function") so.addEventListener("change", updateOrientation);
      window.addEventListener("orientationchange", updateOrientation);
      window.addEventListener("resize", updateOrientation);
      document.addEventListener("visibilitychange", updateOrientation);
      if (!so || typeof so.lock !== "function") return;
      function lock() { try { so.lock("portrait").catch(function () {}); } catch (e) {} }
      lock();
      document.addEventListener("pointerdown", lock, { once: true, passive: true });
      document.addEventListener("fullscreenchange", lock);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) lock(); });
    })();
  </script>

  <!-- 起動エラーの可視化と自己修復 (白画面のまま固まらないように) -->
  <script>
    (function () {
      var panel = null, ready = false, timer;
      function clearPanel() { if (panel) panel.remove(); panel = null; }
      function showPanel(title, msg, failed) {
        if (ready && !failed) return;
        clearPanel();
        var d = document.createElement("div");
        d.id = "boot-notice";
        d.setAttribute("role", failed ? "alert" : "status");
        d.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#0b0b12;color:#e7e3d4;" +
          "display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;" +
          "padding:24px;text-align:center;font-family:monospace";
        var h = document.createElement("div"); h.textContent = title;
        h.style.cssText = "font-size:18px;font-weight:bold";
        var m = document.createElement("div"); m.textContent = msg || "";
        m.style.cssText = "font-size:13px;color:#9b97a8;max-width:420px;word-break:break-all";
        var b = document.createElement("button"); b.textContent = "再読み込み";
        b.style.cssText = "font-size:15px;padding:14px 22px;border-radius:8px;border:1px solid #c9a227;background:#1d1d2b;color:#ffd84a";
        b.onclick = function () { location.reload(); };
        d.append(h, m, b);
        if (failed) {
          var repair = b.cloneNode(true); repair.textContent = "キャッシュを消して再読み込み";
          repair.onclick = function () {
            repair.disabled = true; repair.textContent = "修復中…";
            var work = [];
            if (window.caches && caches.keys) work.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) work.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            Promise.all(work).catch(function () {}).then(function () { location.reload(); });
          };
          d.appendChild(repair);
        }
        document.body.appendChild(d); panel = d;
      }
      function showFatal(msg) {
        clearTimeout(timer);
        showPanel("⚠ 読み込みに失敗しました", msg, true);
      }
      window.dosBoot = {
        ready: function () { ready = true; clearTimeout(timer); clearPanel(); },
        fail: showFatal
      };
      window.addEventListener("error", function (ev) {
        if (!ready) showFatal(ev.message || (ev.error && ev.error.message) || "ゲームを読み込めませんでした。");
      });
      window.addEventListener("unhandledrejection", function (ev) {
        if (!ready) showFatal(ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason || ""));
      });
      // 遅い回線でも黒い幕と燭台のまま待つ。失敗時だけ復旧の案内を出す。
    })();
  </script>
  <script type="module" src="src/game.js" onerror="window.dosBoot.fail('ゲームを読み込めませんでした。接続を確かめて、再読み込みしてください。')"></script>
</body>
