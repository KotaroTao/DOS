name: Cloud save regression checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tools/cloud/**'
      - 'tools/save-protection/**'
      - 'tools/effects/**'
      - 'art/effects/**'
      - '.github/workflows/cloud-save-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /src/
            /supabase/
            /tools/
            /docs/skill-effects-catalog.csv
            /art/effects/
            /art/battle/w01.webp
            /art/monsters/bs_bonepile.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated database checker
        run: npm install --prefix /tmp/dos-cloud-check --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: Check JavaScript syntax
        run: |
          for f in $(git ls-files 'src/*.js'); do node --check "$f" || exit 1; done
      - name: 技演出の全割当・予算・乱数不変を検査
        run: |
          node tools/effects/build-catalog.mjs --check
          node tools/effects/check.mjs
          node tools/effects/organic-check.mjs
          node tools/balance/effect-scope-check.mjs
      - name: Check choice log prototype
        run: |
          node tools/cloud/auth-check.mjs
          node tools/cloud/ledger-check.mjs /tmp/dos-cloud-check/node_modules/@electric-sql/pglite/dist/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 試遊ブラウザの準備
        run: python3 -m pip install playwright
      - name: 試遊画面の確定前不変・再送・計測を検査
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8000 > /tmp/dos-choice-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python3 tools/cloud/windup-browser.py
          python3 tools/cloud/normal-impact-browser.py
          python3 tools/effects/combat-readability.py
          python3 tools/effects/result-finish-browser.py
      - name: 本番B方式の実ゲーム・復旧・終了検証
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8001 > /tmp/dos-ledger-http.log 2>&1 &
          http=$!
          node tools/cloud/test-server.mjs /tmp/dos-cloud-check/node_modules/@electric-sql/pglite/dist/index.js > /tmp/dos-ledger-api.log 2>&1 &
          api=$!
          trap 'kill "$http" "$api"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/test/state > /dev/null && break; sleep 1; done
          node tools/cloud/cancel-check.mjs
          python3 tools/cloud/ledger-opening-browser.py
          python3 tools/cloud/ledger-cancel-browser.py
          python3 tools/cloud/abandon-browser.py
          node tools/infinite/check.mjs
          DOS_TEST_BASE=http://127.0.0.1:8001/ python3 tools/infinite/bukon-return-browser.py
          DOS_TEST_BASE=http://127.0.0.1:8001/ python3 tools/infinite/enemy-size-browser.py
          python3 tools/cloud/ledger-browser.py
          DOS_LEDGER_NO_WORKER=1 python3 tools/cloud/ledger-browser.py
      - name: Check save, retry, recovery and database contracts
        run: python3 tools/cloud/audit.py --node-only --pglite /tmp/dos-cloud-check/node_modules/@electric-sql/pglite/dist/index.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-save-checks
          path: |
            /tmp/dos-cloud-audit
            /tmp/dos-skill-fx-check
            /tmp/dos-material-fx
            /tmp/dos-combat-readability
