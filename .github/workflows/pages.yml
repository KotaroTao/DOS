name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-save-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 原画・制作記録・道具は公開しないため、最初から取得しない
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/tools/
            !/art/story-review/
      - uses: actions/setup-node@v4
        if: vars.CLOUD_SAVE_ENABLED == 'true'
        with:
          node-version: '24'
      - name: Configure Cloud Save
        if: vars.CLOUD_SAVE_ENABLED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: node supabase/deploy.mjs --prepare
      - uses: supabase/setup-cli@v1
        if: vars.CLOUD_SAVE_ENABLED == 'true'
        with:
          version: 2.120.0
      - name: Update Cloud Save API
        if: vars.CLOUD_SAVE_ENABLED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          supabase secrets set GAME_ALLOWED_ORIGINS=https://kotarotao.github.io --project-ref "$SUPABASE_PROJECT_REF"
          docker info > /dev/null
          npm exec --yes --package=esbuild@0.25.12 -- esbuild supabase/functions/game-save/index.js --bundle --format=esm --platform=neutral --target=es2022 --minify --allow-overwrite --outfile=supabase/functions/game-save/index.js
          supabase functions deploy game-save --project-ref "$SUPABASE_PROJECT_REF" --use-docker
          node supabase/deploy.mjs --config
      - name: Stamp image content revisions
        run: python3 .github/scripts/stamp-media.py
      # sw.js のキャッシュ版をデプロイのたびにコミットのハッシュで付け直す
      # (リポジトリでは "dos-dev" のまま。手で版を上げる運用は廃止)
      - name: Stamp Service Worker cache version
        env:
          CLOUD_SAVE_ENABLED: ${{ vars.CLOUD_SAVE_ENABLED }}
        run: |
          v="dos-${GITHUB_SHA::12}"
          if [ "$CLOUD_SAVE_ENABLED" = true ]; then v="${v}-cloud-${GITHUB_RUN_ID}"; fi
          sed -i "s/^const CACHE = \"dos-dev\";/const CACHE = \"$v\";/" sw.js
          sed -i "s/^export const TEST_BUILD = \"dos-dev\";/export const TEST_BUILD = \"$v\";/" src/playtest.js
          grep -q "^const CACHE = \"$v\";" sw.js || { echo "sw.js の CACHE を書き換えられませんでした"; exit 1; }
          grep -q "^export const TEST_BUILD = \"$v\";" src/playtest.js || { echo "試遊の版を書き換えられませんでした"; exit 1; }
          sed -i "s/^export const APP_VERSION = \"dos-dev\";/export const APP_VERSION = \"$v\";/" src/game-update.js
          grep -q "^export const APP_VERSION = \"$v\";" src/game-update.js || { echo "更新確認の版を書き換えられませんでした"; exit 1; }
          grep -n "^const CACHE" sw.js
      # ゲームが読まないもの (制作記録・原画・道具・確認用の画像) を公開物から外す。
      # GitHub Pages の公開サイトは 1GB まで。リポジトリ全体は 949MB あり、
      # 第四章の原画 (#658) で上限すれすれになって更新が届かなくなっていた。
      - name: Strip files the game does not ship
        run: |
          rm -rf docs tools art/story-review
          rm -rf supabase
          rm -f AGENTS.md CLAUDE.md README.md log-many.png seg360.png seg420.png segord.png tab.png
          # sw.js の ASSETS に載せた品が消えていれば SW の導入に失敗するので止める
          # ASSETS の外には実ファイルではない内部キャッシュのキーもあるので含めない
          missing=0
          for f in $(sed -n '/^const ASSETS = \[/,/^\];/p' sw.js | grep -oE '"\./[^"]+"' | tr -d '"'); do
            [ -e "$f" ] || { echo "ASSETS にあるのに公開物に無い: $f"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          mb=$(du -sm --exclude=.git . | cut -f1)
          echo "公開するサイトの大きさ: ${mb}MB"
          # 上限 1GB に届く前に気づけるよう 800MB で止める
          [ "$mb" -lt 800 ] || { echo "公開物が ${mb}MB あり、GitHub Pages の上限 (1GB) に近すぎます"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
