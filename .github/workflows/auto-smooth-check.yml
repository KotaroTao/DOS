name: オート戦闘の描画と作戦
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/performance/auto-*'
      - 'tools/performance/update-auto-check.mjs'
      - 'tools/performance/battle-diagnostics-browser.py'
      - 'tools/performance/battle-trace-check.mjs'
      - 'tools/performance/party-render-browser.py'
      - 'tools/performance/gear-hints-browser.py'
      - 'tools/performance/town-gear-browser.py'
      - 'tools/performance/town-image-cache-browser.py'
      - 'tools/performance/town-facility-browser.py'
      - 'tools/performance/town-quest-cache-check.mjs'
      - 'tools/performance/town-progress-check.mjs'
      - 'tools/performance/gear-hints-check.mjs'
      - 'tools/effects/tone-cache-browser.py'
      - 'tools/performance/battle-gap-browser.py'
      - 'tools/performance/battle-loading-browser.py'
      - 'tools/performance/battle-render-browser.py'
      - 'tools/performance/enemy-level-check.mjs'
      - '.github/workflows/auto-smooth-check.yml'
permissions:
  contents: read
jobs:
  auto-smooth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /tools/
            /art/effects/
            /art/town/
            /art/battle/w01.webp
            /art/monsters/bs_bonepile.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install playwright
      - name: 作戦と乱数・対象・表示の検査
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tools/performance/town-quest-cache-check.mjs
          node tools/performance/town-progress-check.mjs
          node tools/performance/auto-perk-cap-check.mjs
          node tools/performance/auto-empty-bonus-check.mjs
          node tools/performance/auto-forecast-cost-check.mjs
          node tools/performance/auto-passive-check.mjs
          node tools/performance/auto-element-check.mjs
          node tools/performance/auto-allocation-check.mjs
          node tools/performance/auto-estimate-check.mjs
          node tools/balance/auto-intelligence.mjs
          node tools/balance/auto-resistance.mjs
          node tools/performance/battle-trace-check.mjs
          node tools/performance/gear-hints-check.mjs
          node tools/performance/enemy-level-check.mjs
          node tools/performance/auto-frame-check.mjs
          node tools/performance/update-auto-check.mjs
          python3 -m http.server 8000 > /tmp/auto-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python3 tools/performance/battle-loading-browser.py
          python3 tools/performance/battle-render-browser.py
          python3 tools/performance/auto-worker-browser.py
          python3 tools/effects/tone-cache-browser.py
          python3 tools/performance/battle-diagnostics-browser.py
          python3 tools/performance/party-render-browser.py
          python3 tools/performance/gear-hints-browser.py
          python3 tools/performance/town-gear-browser.py
          python3 tools/performance/town-image-cache-browser.py
          python3 tools/performance/battle-gap-browser.py
          AUTO_REPORT=/tmp/dos-auto-combat.json python3 tools/performance/auto-combat-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-combat-performance
          path: /tmp/dos-auto-combat.json
